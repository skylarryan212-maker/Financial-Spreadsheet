<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#f3f0e8">
<title>MCI V5</title>
<style>
html,body{margin:0;min-height:100%;background:#f3f0e8;color:#15222d;font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
#status{min-height:100vh;display:grid;place-items:center;padding:28px;text-align:center;box-sizing:border-box}
.box{max-width:520px}.spinner{width:34px;height:34px;border:3px solid #d7d1c5;border-top-color:#315f86;border-radius:50%;margin:0 auto 14px;animation:s .8s linear infinite}
small{color:#69737d}@keyframes s{to{transform:rotate(360deg)}}
</style>
</head>
<body>
<div id="status"><div class="box"><div class="spinner"></div><strong>Loading MCI V5…</strong><br><small>Preparing the interactive leaderboard.</small></div></div>
<script>
(async()=>{
  const status=document.getElementById('status');
  try{
    const names=['p00','p01','p02','p03','p04','p05','p06','p07'];
    const parts=await Promise.all(names.map(async n=>{
      const r=await fetch('./'+n,{cache:'no-store'});
      if(!r.ok) throw new Error(n+' returned '+r.status);
      return (await r.text()).trim();
    }));
    const b64=parts.join('');
    const binary=atob(b64);
    const bytes=new Uint8Array(binary.length);
    for(let i=0;i<binary.length;i++) bytes[i]=binary.charCodeAt(i);
    if(!('DecompressionStream' in window)) throw new Error('Your browser does not support gzip decompression. Please use current Safari, Chrome, or Edge.');
    const html=await new Response(new Blob([bytes]).stream().pipeThrough(new DecompressionStream('gzip'))).text();
    document.open();
    document.write(html);
    document.close();
  }catch(err){
    status.innerHTML='<div class="box"><strong>Could not load the dashboard.</strong><p>'+String(err&&err.message||err)+'</p><small>Refresh the page. If this continues, open it in Safari or Chrome.</small></div>';
    console.error(err);
  }
})();
</script>
</body>
</html>
